<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f35" />
    <link rel="icon" href="/icon.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Cloudflare Web Analytics. PUBLIC_CF_BEACON_TOKEN is set only on the
         production Vercel environment, so local and preview builds don't count visits. -->
    <script>
      {
        const token = '%sveltekit.env.PUBLIC_CF_BEACON_TOKEN%';
        if (token) {
          const beacon = document.createElement('script');
          beacon.type = 'module';
          beacon.dataset.cfBeacon = JSON.stringify({ token });
          beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          document.body.append(beacon);
        }
      }
    </script>
  </body>
</html>
